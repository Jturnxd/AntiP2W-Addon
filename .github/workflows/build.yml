name: ./gradlew build

on:
  push:
    branches: [ "v2" ]
  pull_request:
    branches: [ "v2" ]

jobs:
  build:

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 23

    - name: Set up Gradle caching
      uses: gradle/actions/setup-gradle@v4

    - name: Run ./gradlew build
      run: ./gradlew build

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: build/libs/*.jar
